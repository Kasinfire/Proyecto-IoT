# Ejecutar desde la raíz del repositorio: mosquitto -c broker/mosquitto.conf
# No se habilita listener sin TLS; usar solo MQTTS en el puerto 8883.
# Un solo listener: la autenticación y la ACL son globales (per_listener_settings ya es
# obsoleto en Mosquitto 2.1).
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file broker/passwd
acl_file broker/acl
certfile certs/broker.crt
keyfile .secrets/broker.key
persistence true
persistence_location broker/
